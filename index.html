<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Приёмка</title>
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Приёмка">
<style>
  :root{
    --bg:#E3E5E0; --surface:#fff; --ink:#101418; --muted:#6E7379;
    --line:#CDD0CA; --amber:#FFB020; --red:#D8402F; --ok:#2F7D5B;
    --disp:'Oswald','Arial Narrow',Impact,'Helvetica Neue',sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%;background:var(--bg);
    font-family:var(--body);color:var(--ink);font-size:16px}
  .disp{font-family:var(--disp);letter-spacing:.04em;text-transform:uppercase}
  button,input,select{font-family:inherit;font-size:16px}
  :focus-visible{outline:3px solid var(--amber);outline-offset:2px}

  .stripe{height:10px;background:repeating-linear-gradient(115deg,var(--red) 0 14px,var(--amber) 14px 28px)}
  header{background:var(--surface);border-bottom:1px solid var(--line)}
  .head-pad{padding:14px 16px 12px}
  .title{font-size:19px;line-height:1}
  .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .tabs{display:flex;border-top:1px solid var(--line)}
  .tab{flex:1;padding:14px 8px;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer}
  .tab.on{background:var(--ink);color:#fff}

  .wrap{padding:16px}
  .btn{font-family:var(--disp);letter-spacing:.04em;text-transform:uppercase;
    font-size:14px;padding:15px 18px;border-radius:2px;min-height:52px;cursor:pointer;
    background:var(--ink);color:#fff;border:1px solid var(--ink);width:100%}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.dark{background:transparent;color:#fff;border:1px solid #3A434C}
  .btn.warn{background:transparent;color:var(--red);border:1px solid var(--red)}
  .btn.go{background:var(--amber);color:var(--ink);border:1px solid var(--amber)}
  .btn:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:8px}

  .card{background:var(--surface);border:1px solid var(--line);margin-bottom:10px;display:flex}
  .card .bar{width:6px;background:var(--amber)}
  .card.shot .bar{background:var(--ok)}
  .card .in{flex:1;padding:14px}
  .reg{font-size:24px;line-height:1}
  .meta{font-size:13px;color:var(--muted);margin-top:6px}
  .last{font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .card.shot .last{color:var(--ok)}

  label.f{display:block;margin-bottom:14px}
  label.f .lab{font-size:11px;color:var(--muted);margin-bottom:6px;
    font-family:var(--disp);letter-spacing:.04em;text-transform:uppercase}
  .inp{width:100%;padding:14px 12px;background:var(--surface);
    border:1px solid var(--line);border-radius:2px;outline:none;color:var(--ink)}
  .inp.big{font-family:var(--disp);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
  .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .chip{font-family:var(--disp);letter-spacing:.04em;text-transform:uppercase;font-size:12px;
    padding:9px 12px;background:transparent;color:var(--muted);
    border:1px solid var(--line);border-radius:2px;cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .err{color:var(--red);font-size:13px;margin-bottom:12px}
  .empty{background:var(--surface);border:1px dashed var(--line);padding:24px;
    text-align:center;margin-bottom:12px}
  .note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}

  /* съёмка */
  #cap{position:fixed;inset:0;background:var(--ink);display:none;flex-direction:column;z-index:10}
  #cap.on{display:flex}
  .cap-head{padding:10px 12px;color:#fff;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .cap-n{font-family:var(--disp);font-size:24px;color:var(--amber);line-height:1}
  .cap-name{font-size:14px;font-weight:600}
  .cap-hint{font-size:12px;color:#A7ADB4}
  .dist{font-family:var(--disp);font-size:15px;padding:5px 9px;background:var(--amber);
    color:var(--ink);white-space:nowrap;line-height:1}
  .view{position:relative;flex:1 1 auto;background:#000;overflow:hidden;min-height:200px}
  .view video,.view img.shot{width:100%;height:100%;display:block}
  .view video{object-fit:cover}
  .view img.shot{object-fit:contain}
  .view svg{position:absolute;inset:0;pointer-events:none}
  .thumb{position:absolute;left:8px;bottom:8px;width:76px;border:2px solid var(--amber)}
  .thumb img{width:100%;display:block}
  .thumb span{display:block;font-family:var(--disp);font-size:9px;background:var(--amber);
    color:var(--ink);text-align:center;padding:2px 0}
  .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;color:#fff}
  .turn{position:absolute;inset:0;background:rgba(16,20,24,.92);display:none;
    align-items:center;justify-content:center;padding:30px;text-align:center;color:#fff}
  .turn.on{display:flex}
  .cap-foot{padding:10px 12px 16px;flex:0 0 auto}
  .prog{display:flex;gap:3px;margin-bottom:10px}
  .prog i{flex:1;height:4px;background:#2A323A}
  .prog i.done{background:var(--amber)}
  .prog i.cur{background:#5A6570}
  .ctrl{display:flex;align-items:center;gap:10px}
  .ctrl .btn{width:auto;flex:1;min-height:48px;font-size:12px;padding:12px}
  .shutter{width:74px;height:74px;border-radius:50%;background:var(--amber);
    border:4px solid #fff;flex:0 0 auto;cursor:pointer}
  .shutter:disabled{background:#3A434C}
  .redo{width:74px;height:74px;border-radius:50%;background:transparent;color:#fff;
    border:2px solid #5A6570;flex:0 0 auto;font-family:var(--disp);font-size:12px;cursor:pointer}
  #crash{display:none;padding:16px;background:var(--red);color:#fff;font-size:13px;
    white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div id="crash"></div>
<div id="app"></div>

<div id="cap">
  <div class="cap-head">
    <div class="cap-n" id="capN">01</div>
    <div style="flex:1;min-width:0">
      <div class="cap-name" id="capName"></div>
      <div class="cap-hint" id="capHint"></div>
    </div>
    <div class="dist" id="capDist"></div>
  </div>
  <div class="view" id="capView">
    <video id="cam" playsinline muted autoplay></video>
    <img class="shot" id="capShot" style="display:none" alt="">
    <svg id="capSvg"></svg>
    <div class="thumb" id="capThumb" style="display:none">
      <img id="capThumbImg" alt=""><span>прошлый раз</span>
    </div>
    <div class="fallback" id="capFallback" style="display:none">
      <div>
        <div class="disp" style="font-size:15px;margin-bottom:8px">Камера недоступна</div>
        <div style="font-size:13px;color:#A7ADB4;margin-bottom:16px" id="capFallbackMsg">
          Разрешите доступ к камере или снимите обычной камерой телефона.
        </div>
        <label class="disp" style="font-size:13px;background:var(--amber);color:var(--ink);padding:14px 18px;display:inline-block;cursor:pointer">
          Открыть камеру телефона
          <input type="file" accept="image/*" capture="environment" id="capFile" style="display:none">
        </label>
      </div>
    </div>
    <div class="turn" id="capTurn">
      <div>
        <div class="disp" style="font-size:20px;color:var(--amber);margin-bottom:10px">Поверните телефон</div>
        <div style="font-size:14px;color:#A7ADB4">Снимаем только вертикально — так кадры сходятся между собой.</div>
      </div>
    </div>
  </div>
  <div class="cap-foot">
    <div class="prog" id="capProg"></div>
    <div class="ctrl">
      <button class="btn dark" id="capPrev">Назад</button>
      <button class="shutter" id="capShoot" aria-label="Снять кадр"></button>
      <button class="redo" id="capRedo" style="display:none">Пере&#8209;снять</button>
      <button class="btn dark" id="capNext">Дальше</button>
    </div>
    <div id="capErr" style="color:var(--amber);font-size:12px;margin-top:10px"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn dark" id="capCancel" style="flex:1;min-height:46px;font-size:12px">Прервать</button>
      <button class="btn go" id="capDone" style="flex:2;min-height:46px;font-size:13px">Завершить</button>
    </div>
  </div>
</div>

<script>
window.onerror = function (m, s, l) {
  var c = document.getElementById('crash');
  c.style.display = 'block';
  c.textContent = 'Ошибка: ' + m + ' (строка ' + l + ')';
};

/* ---------------- данные ---------------- */
var TRAILER_TYPES = ['Тент','Рефрижератор','Изотерм','Платформа','Самосвал','Цистерна','Контейнеровоз'];
var TRACTOR_TYPES = ['Тягач 4x2','Тягач 6x2','Тягач 6x4'];
var MAN_MODELS = ['MAN TGX','MAN TGS','MAN TGM','MAN TGL'];

/* ratio — ширина/высота контура. Всё снимается вертикально. */
var TRAILER_SHOTS = [
  {n:1, name:'Передняя стенка',        hint:'Стенка целиком, стоять по центру', dist:'4 м',   frame:'rect',    ratio:0.62},
  {n:2, name:'Левый борт: перёд',      hint:'Первая треть борта',               dist:'4 м',   frame:'rect',    ratio:1.10},
  {n:3, name:'Левый борт: середина',   hint:'Средняя треть борта',              dist:'4 м',   frame:'rect',    ratio:1.10},
  {n:4, name:'Левый борт: зад',        hint:'Последняя треть борта',            dist:'4 м',   frame:'rect',    ratio:1.10},
  {n:5, name:'Задние двери',           hint:'Двери закрыты, номер читается',    dist:'3,5 м', frame:'rect',    ratio:0.62},
  {n:6, name:'Правый борт: зад',       hint:'Зеркально кадру 4',                dist:'4 м',   frame:'rect',    ratio:1.10},
  {n:7, name:'Правый борт: середина',  hint:'Зеркально кадру 3',                dist:'4 м',   frame:'rect',    ratio:1.10},
  {n:8, name:'Правый борт: перёд',     hint:'Зеркально кадру 2',                dist:'4 м',   frame:'rect',    ratio:1.10},
  {n:9, name:'Угол передний правый',   hint:'В кадре стенка и борт разом',      dist:'4 м',   frame:'corner',  ratio:0.95},
  {n:10,name:'Угол задний левый',      hint:'В кадре двери и борт разом',       dist:'4 м',   frame:'cornerL', ratio:0.95},
  {n:11,name:'Колёса слева',           hint:'Все оси в кадре, диски видно',     dist:'2 м',   frame:'rect',    ratio:1.40},
  {n:12,name:'Колёса справа',          hint:'Все оси в кадре, диски видно',     dist:'2 м',   frame:'rect',    ratio:1.40},
  {n:13,name:'Опорные ноги, шкворень', hint:'Присесть, снимать снизу вверх',    dist:'1,5 м', frame:'rect',    ratio:1.00},
  {n:14,name:'Номер и таблички',       hint:'Номер должен читаться полностью',  dist:'0,8 м', frame:'rect',    ratio:1.40}
];

var TRACTOR_SHOTS = [
  {n:1, name:'Перёд: решётка, бампер', hint:'По центру, кабина целиком',       dist:'3 м',   frame:'rect',    ratio:0.70},
  {n:2, name:'Слева: кабина',          hint:'Дверь, зеркала, крыло',           dist:'3,5 м', frame:'rect',    ratio:1.00},
  {n:3, name:'Слева: бак и рама',      hint:'Бак, ступени, рама',              dist:'3,5 м', frame:'rect',    ratio:1.00},
  {n:4, name:'Зад кабины и седло',     hint:'Седло, шланги, площадка',         dist:'2,5 м', frame:'rect',    ratio:0.90},
  {n:5, name:'Справа: бак и рама',     hint:'Зеркально кадру 3',               dist:'3,5 м', frame:'rect',    ratio:1.00},
  {n:6, name:'Справа: кабина',         hint:'Зеркально кадру 2',               dist:'3,5 м', frame:'rect',    ratio:1.00},
  {n:7, name:'Угол передний левый',    hint:'В кадре перёд и борт разом',      dist:'3,5 м', frame:'cornerL', ratio:0.95},
  {n:8, name:'Угол задний правый',     hint:'В кадре седло и борт разом',      dist:'3,5 м', frame:'corner',  ratio:0.95},
  {n:9, name:'Лобовое стекло',         hint:'Сколы и трещины, чуть под углом', dist:'1,5 м', frame:'rect',    ratio:1.30},
  {n:10,name:'Колёса слева',           hint:'Обе оси, диски и резина',         dist:'1,5 м', frame:'rect',    ratio:1.40},
  {n:11,name:'Колёса справа',          hint:'Обе оси, диски и резина',         dist:'1,5 м', frame:'rect',    ratio:1.40},
  {n:12,name:'Салон: панель, сиденья', hint:'От двери, одним заходом',         dist:'1 м',   frame:'rect',    ratio:0.80}
];

function shotsFor(k){ return k === 'trailer' ? TRAILER_SHOTS : TRACTOR_SHOTS; }

/* ---------------- хранилище ---------------- */
var dbp = null;
function openDB(){
  if (dbp) return dbp;
  dbp = new Promise(function(res, rej){
    var r = indexedDB.open('priyomka', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
  return dbp;
}
function dbGet(k){
  return openDB().then(function(db){
    return new Promise(function(res, rej){
      var q = db.transaction('kv','readonly').objectStore('kv').get(k);
      q.onsuccess = function(){ res(q.result === undefined ? null : q.result); };
      q.onerror = function(){ rej(q.error); };
    });
  }).catch(function(){ return null; });
}
function dbSet(k, v){
  return openDB().then(function(db){
    return new Promise(function(res, rej){
      var q = db.transaction('kv','readwrite').objectStore('kv').put(v, k);
      q.onsuccess = function(){ res(true); };
      q.onerror = function(){ rej(q.error); };
    });
  }).catch(function(){ return false; });
}

var K_UNITS = 'fleet:units', K_INDEX = 'fleet:sessions';

/* ---------------- состояние ---------------- */
var S = { units:{trailers:[],tractors:[]}, sessions:[], kind:'trailer',
          screen:'list', editing:null, q:'', err:'' };

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function normReg(s){ return s.toUpperCase().replace(/\s+/g,' ').trim(); }
function fmtDate(iso){
  var d = new Date(iso), p = function(x){ return ('0'+x).slice(-2); };
  return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function curList(){ return S.kind === 'trailer' ? S.units.trailers : S.units.tractors; }
function lastFor(id){
  for (var i=0;i<S.sessions.length;i++) if (S.sessions[i].unitId === id) return S.sessions[i];
  return null;
}
function saveUnits(){ return dbSet(K_UNITS, JSON.parse(JSON.stringify(S.units))); }

/* ---------------- отрисовка ---------------- */
var app = document.getElementById('app');

function render(){
  var h = '<header><div class="stripe"></div><div class="head-pad">'
    + '<div class="disp title">Приёмка</div>'
    + '<div class="sub">Съёмка по контуру, база машин</div></div><div class="tabs">'
    + '<button class="tab disp' + (S.kind==='trailer'?' on':'') + '" data-kind="trailer">Прицепы'
    + (S.units.trailers.length ? ' · ' + S.units.trailers.length : '') + '</button>'
    + '<button class="tab disp' + (S.kind==='tractor'?' on':'') + '" data-kind="tractor">Тягачи'
    + (S.units.tractors.length ? ' · ' + S.units.tractors.length : '') + '</button>'
    + '</div></header>';
  h += S.screen === 'form' ? formHTML() : listHTML();
  app.innerHTML = h;
  bind();
}

function listHTML(){
  var list = curList(), q = S.q.toUpperCase().trim();
  var arr = list.filter(function(u){
    return !q || u.reg.indexOf(q) >= 0 || (u.brand||'').toUpperCase().indexOf(q) >= 0;
  }).sort(function(a,b){ return a.reg.localeCompare(b.reg); });

  var h = '<div class="wrap">';
  if (list.length > 3)
    h += '<input class="inp" id="q" placeholder="Поиск по номеру или марке" value="'+esc(S.q)+'" style="margin-bottom:12px">';

  if (!arr.length){
    h += '<div class="empty"><div class="disp" style="font-size:15px;margin-bottom:6px">'
       + (list.length ? 'Ничего не найдено' : 'База пустая') + '</div>'
       + '<div style="font-size:13px;color:var(--muted)">'
       + (list.length ? 'Измените запрос.' : 'Добавьте первый номер — на него повесятся съёмки.')
       + '</div></div>';
  } else {
    arr.forEach(function(u){
      var last = lastFor(u.id);
      h += '<div class="card' + (last ? ' shot' : '') + '"><div class="bar"></div><div class="in">'
         + '<div class="disp reg">'+esc(u.reg)+'</div>'
         + '<div class="meta">'+esc([u.type,u.brand].filter(Boolean).join(' · ') || 'без описания')+'</div>'
         + '<div class="last">'
         + (last ? 'Снимали '+fmtDate(last.date)+' · '+last.count+' кадров' : 'Съёмок ещё не было')
         + '</div><div class="row" style="margin-top:12px">'
         + '<button class="btn" data-shoot="'+u.id+'" style="flex:2;min-height:46px;font-size:12px">Снять</button>'
         + '<button class="btn ghost" data-edit="'+u.id+'" style="flex:1;min-height:46px;font-size:12px">Изменить</button>'
         + '</div></div></div>';
    });
  }

  h += '<button class="btn" id="add" style="margin-top:6px">+ '
     + (S.kind === 'trailer' ? 'Добавить прицеп' : 'Добавить тягач') + '</button>'
     + '<div class="note">Снимать только вертикально. Комплекты хранятся на устройстве, при следующей съёмке прошлый кадр показывается в углу.</div></div>';
  return h;
}

function formHTML(){
  var e = S.editing, isTrailer = S.kind === 'trailer';
  var types = isTrailer ? TRAILER_TYPES : TRACTOR_TYPES;
  var brand = e ? (e.brand||'') : (isTrailer ? '' : 'MAN TGX');
  var h = '<div class="wrap"><div class="disp" style="font-size:20px;margin-bottom:18px">'
        + (e ? 'Изменить' : (isTrailer ? 'Новый прицеп' : 'Новый тягач')) + '</div>';

  h += '<label class="f"><div class="lab">Регистрационный номер</div>'
     + '<input class="inp big" id="reg" autocapitalize="characters" value="'+esc(e?e.reg:'')+'" placeholder="'
     + (isTrailer ? 'WGM 5842X' : 'AB 1234-7') + '"></label>';

  h += '<label class="f"><div class="lab">Тип</div><select class="inp" id="type">';
  types.forEach(function(t){ h += '<option'+(e && e.type===t ? ' selected':'')+'>'+esc(t)+'</option>'; });
  h += '</select></label>';

  h += '<label class="f"><div class="lab">'+(isTrailer?'Марка и модель':'Модель')+'</div>'
     + '<input class="inp" id="brand" value="'+esc(brand)+'" placeholder="'
     + (isTrailer ? 'Schmitz SCS 24' : 'MAN TGX 18.510') + '">';
  if (!isTrailer){
    h += '<div class="chips">';
    MAN_MODELS.forEach(function(m){
      h += '<button class="chip'+(brand.indexOf(m)===0?' on':'')+'" data-model="'+esc(m)+'">'+esc(m.replace('MAN ',''))+'</button>';
    });
    h += '</div>';
  }
  h += '</label>';

  h += '<label class="f"><div class="lab">Примечание</div>'
     + '<input class="inp" id="note" value="'+esc(e?(e.note||''):'')+'" placeholder="Известные дефекты, особенности"></label>';

  if (S.err) h += '<div class="err">'+esc(S.err)+'</div>';

  h += '<div class="row"><button class="btn" id="save" style="flex:2">Сохранить</button>'
     + '<button class="btn ghost" id="cancel" style="flex:1">Отмена</button></div>';
  if (e) h += '<button class="btn warn" id="del" style="margin-top:10px">Удалить из базы</button>';
  return h + '</div>';
}

function bind(){
  Array.prototype.forEach.call(app.querySelectorAll('[data-kind]'), function(b){
    b.onclick = function(){ S.kind = b.dataset.kind; S.screen='list'; S.err=''; render(); };
  });
  var q = document.getElementById('q');
  if (q) q.oninput = function(){
    S.q = q.value; var p = q.selectionStart; render();
    var n = document.getElementById('q'); if (n){ n.focus(); n.setSelectionRange(p,p); }
  };
  var add = document.getElementById('add');
  if (add) add.onclick = function(){ S.editing = null; S.err=''; S.screen='form'; render(); };

  Array.prototype.forEach.call(app.querySelectorAll('[data-edit]'), function(b){
    b.onclick = function(){
      S.editing = curList().filter(function(u){ return u.id === b.dataset.edit; })[0];
      S.err=''; S.screen='form'; render();
    };
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-shoot]'), function(b){
    b.onclick = function(){
      var u = curList().filter(function(x){ return x.id === b.dataset.shoot; })[0];
      if (u) startCapture(u);
    };
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-model]'), function(b){
    b.onclick = function(){
      document.getElementById('brand').value = b.dataset.model;
      Array.prototype.forEach.call(app.querySelectorAll('[data-model]'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
    };
  });

  var save = document.getElementById('save');
  if (save) save.onclick = function(){
    var reg = normReg(document.getElementById('reg').value);
    if (!reg){ S.err = 'Введите регистрационный номер.'; return render(); }
    var list = curList(), e = S.editing;
    if (list.filter(function(u){ return u.reg === reg && (!e || u.id !== e.id); }).length){
      S.err = 'Такой номер уже есть в базе.'; return render();
    }
    var unit = { id: e ? e.id : String(Date.now()), reg: reg,
      type: document.getElementById('type').value,
      brand: document.getElementById('brand').value.trim(),
      note: document.getElementById('note').value.trim() };
    if (e){ for (var i=0;i<list.length;i++) if (list[i].id === e.id) list[i] = unit; }
    else list.push(unit);
    saveUnits();
    S.editing = null; S.err=''; S.screen='list'; render();
  };
  var cancel = document.getElementById('cancel');
  if (cancel) cancel.onclick = function(){ S.editing=null; S.err=''; S.screen='list'; render(); };
  var del = document.getElementById('del');
  if (del) del.onclick = function(){
    var id = S.editing.id, next = curList().filter(function(u){ return u.id !== id; });
    if (S.kind === 'trailer') S.units.trailers = next; else S.units.tractors = next;
    saveUnits(); S.editing=null; S.screen='list'; render();
  };
}

/* ---------------- съёмка ---------------- */
var C = { unit:null, kind:'trailer', shots:[], idx:0, photos:{}, prev:null, stream:null, live:false };
var capEl = document.getElementById('cap');
var video = document.getElementById('cam');
var view = document.getElementById('capView');

function startCapture(unit){
  var meta = lastFor(unit.id);
  C.unit = unit; C.kind = S.kind; C.shots = shotsFor(S.kind);
  C.idx = 0; C.photos = {}; C.prev = null; C.live = false;
  document.getElementById('capErr').textContent = '';
  capEl.classList.add('on');
  drawStep();
  if (meta) dbGet('shots:'+meta.id).then(function(s){ C.prev = s; drawStep(); });

  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false})
    .then(function(st){
      C.stream = st; video.srcObject = st;
      var p = video.play(); if (p && p.catch) p.catch(function(){});
      C.live = true; drawStep();
    })
    .catch(function(){
      C.live = false;
      document.getElementById('capFallbackMsg').textContent =
        (location.protocol === 'https:'
          ? 'Разрешите доступ к камере в настройках браузера или снимите обычной камерой телефона.'
          : 'Камера работает только по https. Откройте сайт по адресу, который начинается с https.');
      drawStep();
    });
}

function stopCapture(){
  if (C.stream){ C.stream.getTracks().forEach(function(t){ t.stop(); }); C.stream = null; }
  capEl.classList.remove('on');
}

function drawStep(){
  var s = C.shots[C.idx], got = C.photos[s.n];
  document.getElementById('capN').textContent = ('0'+s.n).slice(-2);
  document.getElementById('capName').textContent = s.name;
  document.getElementById('capHint').textContent = s.hint;
  document.getElementById('capDist').textContent = s.dist;

  var img = document.getElementById('capShot');
  img.style.display = got ? 'block' : 'none';
  if (got) img.src = got;
  video.style.display = got ? 'none' : 'block';
  document.getElementById('capSvg').style.display = got ? 'none' : 'block';
  document.getElementById('capShoot').style.display = got ? 'none' : 'block';
  document.getElementById('capRedo').style.display = got ? 'block' : 'none';
  document.getElementById('capShoot').disabled = !C.live;
  document.getElementById('capFallback').style.display = (!C.live && !got) ? 'flex' : 'none';

  var th = document.getElementById('capThumb');
  var prevPhoto = C.prev && C.prev.photos ? C.prev.photos[s.n] : null;
  if (prevPhoto && !got){ th.style.display='block'; document.getElementById('capThumbImg').src = prevPhoto; }
  else th.style.display = 'none';

  document.getElementById('capPrev').disabled = C.idx === 0;
  document.getElementById('capNext').disabled = C.idx === C.shots.length - 1;

  var done = Object.keys(C.photos).length;
  var d = document.getElementById('capDone');
  d.textContent = 'Завершить · ' + done + '/' + C.shots.length;
  d.disabled = done === 0;

  var p = '';
  C.shots.forEach(function(x){
    p += '<i class="' + (C.photos[x.n] ? 'done' : (x.n === s.n ? 'cur' : '')) + '"></i>';
  });
  document.getElementById('capProg').innerHTML = p;

  checkOrientation();
  drawContour(s);
}

function checkOrientation(){
  var land = view.clientWidth > view.clientHeight;
  document.getElementById('capTurn').className = 'turn' + (land ? ' on' : '');
}

function drawContour(s){
  var svg = document.getElementById('capSvg');
  var w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return;
  svg.setAttribute('width', w); svg.setAttribute('height', h);

  var fillW = 0.97, fillH = 0.94;
  var cw = w * fillW, ch = cw / s.ratio;
  if (ch > h * fillH){ ch = h * fillH; cw = ch * s.ratio; }
  var x = (w - cw) / 2, y = (h - ch) / 2, d;

  if (s.frame === 'corner')
    d = 'M '+x+' '+(y+ch*0.06)+' L '+(x+cw)+' '+(y+ch*0.2)+' L '+(x+cw)+' '+(y+ch)+' L '+x+' '+(y+ch*0.94)+' Z';
  else if (s.frame === 'cornerL')
    d = 'M '+x+' '+(y+ch*0.2)+' L '+(x+cw)+' '+(y+ch*0.06)+' L '+(x+cw)+' '+(y+ch*0.94)+' L '+x+' '+(y+ch)+' Z';
  else
    d = 'M '+x+' '+y+' L '+(x+cw)+' '+y+' L '+(x+cw)+' '+(y+ch)+' L '+x+' '+(y+ch)+' Z';

  var c = 30, cx = x + cw/2, cy = y + ch/2;
  var marks = [[x,y,1,1],[x+cw,y,-1,1],[x,y+ch,1,-1],[x+cw,y+ch,-1,-1]], g = '';
  marks.forEach(function(m){
    g += '<line x1="'+m[0]+'" y1="'+m[1]+'" x2="'+(m[0]+c*m[2])+'" y2="'+m[1]+'"/>'
       + '<line x1="'+m[0]+'" y1="'+m[1]+'" x2="'+m[0]+'" y2="'+(m[1]+c*m[3])+'"/>';
  });

  svg.innerHTML =
      '<defs><mask id="cut"><rect width="'+w+'" height="'+h+'" fill="#fff"/>'
    + '<path d="'+d+'" fill="#000"/></mask></defs>'
    + '<rect width="'+w+'" height="'+h+'" fill="rgba(16,20,24,.45)" mask="url(#cut)"/>'
    + '<path d="'+d+'" fill="none" stroke="#FFB020" stroke-width="3" stroke-dasharray="16 11"/>'
    + '<g stroke="#FFB020" stroke-width="6" stroke-linecap="square">'+g+'</g>'
    + '<line x1="'+cx+'" y1="'+(cy-16)+'" x2="'+cx+'" y2="'+(cy+16)+'" stroke="#FFB020" stroke-width="2" opacity=".8"/>'
    + '<line x1="'+(cx-16)+'" y1="'+cy+'" x2="'+(cx+16)+'" y2="'+cy+'" stroke="#FFB020" stroke-width="2" opacity=".8"/>';
}

/* кадрируем ровно то, что видно на экране — снимок всегда вертикальный */
function grabPortrait(src, sw, sh){
  var targetAR = view.clientWidth / view.clientHeight;
  var sx, sy, cw, chh;
  if (sw / sh > targetAR){ chh = sh; cw = sh * targetAR; sx = (sw - cw) / 2; sy = 0; }
  else { cw = sw; chh = sw / targetAR; sx = 0; sy = (sh - chh) / 2; }

  var max = 1400, sc = Math.min(1, max / Math.max(cw, chh));
  var cv = document.createElement('canvas');
  cv.width = Math.round(cw * sc); cv.height = Math.round(chh * sc);
  cv.getContext('2d').drawImage(src, sx, sy, cw, chh, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.62);
}

document.getElementById('capShoot').onclick = function(){
  if (!video.videoWidth) return;
  C.photos[C.shots[C.idx].n] = grabPortrait(video, video.videoWidth, video.videoHeight);
  if (C.idx < C.shots.length - 1) C.idx++;
  drawStep();
};
document.getElementById('capRedo').onclick = function(){
  delete C.photos[C.shots[C.idx].n]; drawStep();
};
document.getElementById('capPrev').onclick = function(){ if (C.idx>0){ C.idx--; drawStep(); } };
document.getElementById('capNext').onclick = function(){ if (C.idx<C.shots.length-1){ C.idx++; drawStep(); } };
document.getElementById('capCancel').onclick = function(){ stopCapture(); };
document.getElementById('capFile').onchange = function(ev){
  var f = ev.target.files && ev.target.files[0]; if (!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    var im = new Image();
    im.onload = function(){
      C.photos[C.shots[C.idx].n] = grabPortrait(im, im.width, im.height);
      drawStep();
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
};

document.getElementById('capDone').onclick = function(){
  var id = String(Date.now());
  var count = Object.keys(C.photos).length;
  var session = { id:id, unitId:C.unit.id, reg:C.unit.reg, kind:C.kind, driver:'',
    date:new Date().toISOString(), photos:C.photos, count:count };
  var btn = document.getElementById('capDone');
  btn.disabled = true; btn.textContent = 'Сохраняю…';
  dbSet('shots:'+id, session).then(function(ok){
    if (!ok){
      document.getElementById('capErr').textContent = 'Комплект не сохранился. Освободите место и повторите.';
      return drawStep();
    }
    S.sessions.unshift({ id:id, unitId:C.unit.id, reg:C.unit.reg, kind:C.kind,
      driver:'', date:session.date, count:count });
    return dbSet(K_INDEX, S.sessions.slice(0,500)).then(function(){ stopCapture(); render(); });
  });
};

function relayout(){
  if (!capEl.classList.contains('on')) return;
  checkOrientation();
  drawContour(C.shots[C.idx]);
}
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', function(){ setTimeout(relayout, 300); });

/* ---------------- старт ---------------- */
Promise.all([dbGet(K_UNITS), dbGet(K_INDEX)]).then(function(r){
  var u = r[0] || {};
  S.units = { trailers: u.trailers || [], tractors: u.tractors || [] };
  S.sessions = r[1] || [];
  render();
}).catch(function(){ render(); });
</script>
